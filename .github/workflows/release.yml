name: Release Obsidian plugin

# リリースの起動方法は 2 通り:
#   1. main への push … manifest.json の version に対応する Release が未作成なら自動で作成
#      （= version を上げて main に push すればリリースされる）
#   2. タグ push (例: 0.1.0) … タグと manifest.json の version の一致を検証して作成
#
# いずれもプラグインをビルドして main.js / manifest.json を Release に添付する。

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Resolve tag from manifest / ref
        id: vars
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then
            # タグ push で起動した場合はタグと version の一致を検証
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "$version" ]; then
              echo "::error::タグ ($tag) が manifest.json の version ($version) と一致しません。" \
                   "Obsidian ではリリースタグと manifest の version が完全一致している必要があります。"
              exit 1
            fi
          else
            # main への push / 手動起動では version をそのままタグにする
            tag="$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.vars.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "リリース $tag は既に存在します。ビルド・作成をスキップします。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm install

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.vars.outputs.tag }}"

          # 添付する成果物。存在するものだけを渡す (styles.css は任意)。
          assets="main.js manifest.json"
          if [ -f styles.css ]; then
            assets="$assets styles.css"
          fi

          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $assets
